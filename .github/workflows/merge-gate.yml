name: merge gate

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  branch-docs:
    name: branch docs
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Check branch records are mergeable
        run: bash scripts/check-branch-docs.sh

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Check formatting
        shell: bash
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      - name: Build the host binary
        if: runner.os != 'Windows'
        run: go build -trimpath -o skills ./cmd/skills

      - name: Smoke test
        if: runner.os != 'Windows'
        shell: bash
        run: bash scripts/smoke.sh ./skills

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest

  cross:
    name: cross-compile
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build every release target
        shell: bash
        run: |
          set -euo pipefail
          out="$(mktemp -d)"
          build() {
            local goos=$1 goarch=$2 goarm=${3:-}
            local name="skills_${goos}_${goarch}"
            if [ -n "$goarm" ]; then
              name="${name}v${goarm}"
            fi
            if [ "$goos" = windows ]; then
              name="${name}.exe"
            fi
            GOOS=$goos GOARCH=$goarch GOARM=$goarm CGO_ENABLED=0 \
              go build -trimpath -o "$out/$name" ./cmd/skills
            test -s "$out/$name"
          }
          build windows 386
          build windows amd64
          build linux 386
          build linux amd64
          build linux arm64
          build linux arm 6
          build darwin amd64
          build darwin arm64
          ls -l "$out"

  release-check:
    name: release check
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Check the GoReleaser configuration
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: check

      - name: Build all targets without publishing
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: build --snapshot --clean --single-target=false
